name: Build check

# Runs on every PR targeting dev (including Dependabot's) so a broken
# dependency bump shows up as a failing check before merge. Build-only —
# no publish step. See deploy.yml for the actual deploy, which runs on
# push to dev (including the push a PR merge itself creates).
on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build SPA
        run: npm run build
